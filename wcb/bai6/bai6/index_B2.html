<html>
    <head>
        <title>Thêm Giảng viên</title>
        <link rel="stylesheet" type="text/css" href="style_B2.css"/>
    </head>
    <body>
        <form class="form-container">
            <table>
                <tr>
                    <th colspan="2">Thêm Giảng Viên</th>
                </tr>
                <tr>
                    <td>Khoa</td>
                    <td>
                        <select>
                            <option>CNTT</option>
                            <option>Ngoại ngữ</option>
                            <option>Kinh tế</option>
                            <option>Máy</option>
                            <option>Tài chính - kế toán</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Mã giảng viên</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Tên giảng viên</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Chuyên môn</td>
                    <td><input type="text"></td> 
                </tr>
                <tr>
                    <td>Ảnh mô tả</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>Mô tả về giảng viên</td>
                    <td><textarea rows="5" cols="30"></textarea></td>
                </tr>
            </table>
            <div class="form-buttons">
                <button type="submit" class="buttons">Thêm mới</button>
                <button type="reset" class="buttons">Làm lại</button>
            </div>
        </form>
    </body>
</html>
